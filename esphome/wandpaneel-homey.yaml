substitutions:
###### DIT GEDEELTE AANPASSEN ######
  device_name: wandpaneel
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password

##### EIND AANPASBARE SECTIE #####

  # Pin the TFT to the same release as the ESPHome package.
  nextion_update_url: "https://raw.githubusercontent.com/Blackymas/NSPanel_HA_Blueprint/v2026041/nspanel_eu.tft"

packages:
  remote_package:
    url: https://github.com/Blackymas/NSPanel_HA_Blueprint
    ref: v2026041
    files: [nspanel_esphome.yaml]
    refresh: 300s

  # Homey standalone bridge
  homey_bridge: !include homey_bridge.yaml

captive_portal:

web_server:
  port: 80
  version: 3
  auth:
    username: !secret web_server_username
    password: !secret web_server_password
